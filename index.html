<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งล่วงหน้า จงชงดี หนองผึ้ง</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://static.line-scdn.net">
<style>html,body{margin:0;background:#fbf7f4}.h{height:64px;background:#cf1b26}@media (prefers-color-scheme:dark){html,body{background:#1a1311}}</style>
</head><body><div class="h"></div>
<script>
/* หน้านี้แค่โหลดตัวหน้าสั่งจริง (app.html) แบบเช็กเวอร์ชันล่าสุดทุกครั้ง ลูกค้าจะไม่เจอหน้าเก่าค้างในเครื่อง */
(function(){
  function go(){location.replace("app.html"+location.search+location.hash)}
  fetch("app.html",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(function(h){document.open();document.write(h);document.close()}).catch(go);
})();
</script>
</body></html>
