<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งล่วงหน้า จงชงดี หนองผึ้ง</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://api.line.me">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>

/* Layout: single mobile column — pickup picker, menu grid, detail sheet, cart, payment; sticky action bar */
:root{
  --ink:#241714; --ink-soft:#6b5450; --line:#e8dcd8;
  --paper:#fbf7f4; --card:#ffffff; --card-2:#f4ece8;
  --brand:#cf1b26; --brand-deep:#8f0f17; --pop:#f2b705; --ok:#1d7a4c;
  --f-display:"Mitr",system-ui,sans-serif;
  --f-body:"Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f6ece9; --ink-soft:#b39c97; --line:#3a2a27;
  --paper:#1a1210; --card:#241a17; --card-2:#2e211e;
  --brand:#ff5a57; --brand-deep:#ff8b7a; --pop:#ffc93c; --ok:#52c08a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f6ece9; --ink-soft:#b39c97; --line:#3a2a27;
  --paper:#1a1210; --card:#241a17; --card-2:#2e211e;
  --brand:#ff5a57; --brand-deep:#ff8b7a; --pop:#ffc93c; --ok:#52c08a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);margin:0;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--brand)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--brand);color:#fff}
.hbar{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 13px;display:flex;align-items:center;gap:10px}
.mark{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;line-height:1.1;background:#fff;color:var(--brand);border-radius:6px;padding:4px 9px}
.hmeta{font-size:12.5px;opacity:.93;line-height:1.35}
.hmeta b{display:block;font-size:14px;font-weight:600}
.openpill{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 9px;white-space:nowrap}

.notice{background:var(--card-2);border:1px solid var(--line);border-left:4px solid var(--pop);border-radius:4px;padding:11px 13px;margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
.notice b{color:var(--ink);font-weight:600}

h2{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
h2 span{font-family:var(--f-body);font-size:11.5px;font-weight:400;color:var(--ink-soft);letter-spacing:0}

/* pickup picker */
.pick{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-top:14px}
.pick .lab{margin-bottom:9px}
.pick .row{display:flex;gap:8px}
.pick .row>*{flex:1;min-width:0}
input[type=text]{font:inherit;font-size:14px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 11px}
select{font:inherit;font-size:13.5px;width:100%;background:var(--card-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 10px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{min-width:0;text-align:left;font:inherit;cursor:pointer;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:3px;padding:11px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:border-color .12s,transform .12s}
.item:hover{border-color:var(--brand)}
.item:active{transform:scale(.985)}
.item .n{font-weight:600;font-size:13.5px;line-height:1.3}
.item .p{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.item .tag{align-self:flex-start;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--brand-deep);background:color-mix(in srgb,var(--brand) 13%,transparent);border-radius:2px;padding:1px 5px}

.scrim{position:fixed;inset:0;background:rgba(20,10,8,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:12px 12px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-top{position:sticky;top:0;background:var(--paper);padding-block:15px 10px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-top h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0;line-height:1.25;flex:1;min-width:0}
.x{font:inherit;font-size:20px;line-height:1;cursor:pointer;background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:50%;width:30px;height:30px;flex:none}
.grp{margin-top:16px}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{min-width:0;font:inherit;font-size:13px;cursor:pointer;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:3px;padding:8px 12px;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.opt small{color:var(--ink-soft);font-size:11.5px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card));box-shadow:inset 0 0 0 1px var(--brand)}
.opt[aria-pressed="true"] small{color:var(--brand-deep)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.soon{font-size:11.5px;color:var(--ink-soft);margin-top:7px}

/* stepper */
.step{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--card)}
.step button{font:inherit;font-size:17px;line-height:1;cursor:pointer;background:var(--card);color:var(--ink);border:none;width:38px;display:flex;align-items:center;justify-content:center}
.step button:disabled{color:var(--line);cursor:not-allowed}
.step input{font:inherit;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;width:48px;background:var(--card);color:var(--ink);border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:8px 0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step.sm button{width:32px;font-size:15px}
.step.sm input{width:38px;font-size:13px;padding:5px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:11px 12px;display:flex;align-items:center;gap:11px}
.btn{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;cursor:pointer;background:var(--brand);color:#fff;border:none;border-radius:4px;padding:12px 14px;display:flex;justify-content:center;align-items:center;gap:10px}
.btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.btn .amt{font-family:var(--f-body);font-weight:700;font-variant-numeric:tabular-nums}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:none;padding:12px 16px}
.cartcount{font-size:12px;color:var(--ink-soft);line-height:1.3;flex:none}
.cartcount b{display:block;color:var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.line .meta{flex:1;min-width:0}
.line .t{font-weight:600;font-size:13.5px}
.line .s{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.line .acts{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.link{font:inherit;font-size:11.5px;color:var(--brand);background:none;border:none;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.link.mute{color:var(--ink-soft)}
.line .pr{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;white-space:nowrap;padding-top:1px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:13px;font-family:var(--f-display);font-size:17px}
.tot b{font-family:var(--f-body);font-weight:700;font-variant-numeric:tabular-nums;font-size:21px}
.empty{color:var(--ink-soft);font-size:13px;padding:26px 0;text-align:center}

.agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;background:var(--card-2);border:1px solid var(--line);border-radius:4px;padding:12px 13px;font-size:12.5px;line-height:1.5;cursor:pointer}
.agree input{margin:2px 0 0;width:17px;height:17px;flex:none;accent-color:var(--brand)}

.qr{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;text-align:center;margin-top:14px}
.qrbox{width:168px;height:168px;margin:0 auto 12px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 14px),repeating-linear-gradient(0deg,var(--ink) 0 7px,var(--card) 7px 14px);opacity:.82}
.qr .big{font-family:var(--f-body);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.qr .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.drop{display:block;margin-top:14px;border:1.5px dashed var(--line);border-radius:4px;padding:20px 14px;text-align:center;font-size:13px;color:var(--ink-soft);background:var(--card);cursor:pointer}
.steps{list-style:none;margin:16px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:30px;font-size:12.5px;color:var(--ink-soft);margin-bottom:9px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.done{text-align:center;padding:34px 10px 10px}
.check{width:58px;height:58px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h3{font-family:var(--f-display);font-weight:500;font-size:21px;margin:0 0 4px}
.qbig{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1.1;letter-spacing:.03em;border:2.5px solid var(--ink);border-radius:6px;display:inline-block;padding:4px 16px 6px;margin:6px 0 6px}
.oid{font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.09em;margin-top:14px;background:var(--card-2);border:1px solid var(--line);border-radius:3px;padding:9px 14px;display:inline-block}
.foot{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:22px;line-height:1.6}
.demo{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--brand-deep);background:color-mix(in srgb,var(--pop) 30%,transparent);border-radius:2px;padding:2px 7px;display:inline-block;margin-top:14px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.5;padding:10px 14px;border-radius:6px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.qrwait{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
img{max-width:100%}[hidden]{display:none!important}#qrbox img,#qrbox canvas{display:block;margin:0 auto}</style></head>
<body><header>
  <div class="hbar">
    <div class="mark">จง ชง ดี</div>
    <div class="hmeta"><b>สาขาหนองผึ้ง สารภี</b>สั่งล่วงหน้า · รับที่ร้าน</div>
    <div class="openpill" id="hours">07:30–19:30</div>
  </div>
</header>

<div class="wrap">
  <div id="view"><div class="empty" style="padding:60px 0">กำลังเปิดเมนู…</div></div>
  <div class="foot">จงชงดี สาขาหนองผึ้ง · ถนนต้นยาง หน้าหมู่บ้านดีญ่า วาเลย์<br><span id="foothours">เปิดทุกวัน 07:30–19:30 น.</span></div>
</div>
<div class="bar" id="bar" hidden><div class="bar-in" id="barin"></div></div>

<script id="liffsdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script>
const LIFF_ID="2012300584-y5UqCdH1";
const API="https://script.google.com/macros/s/AKfycbzhgL_PjtiL69InY9MfgeU6qiBqjy9AOtIQpsokZsyxdlnNswn9122UGcxS2obP4J0/exec";
const SIZELABEL={XS:"พอจิบ",S:"พอกิน",M:"พออิ่ม",L:"พอจุก"};
const SWEET=["25%","50%","100%"];
const TH_DAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const TH_MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const V=document.getElementById("view"),BAR=document.getElementById("bar"),BARIN=document.getElementById("barin");
const two=n=>String(n).padStart(2,"0");
const baht=n=>Number(n).toLocaleString("th-TH");
const hhmm=m=>two(Math.floor(m/60))+":"+two(m%60);
const toMin=s=>{const m=String(s).match(/(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:0};
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let M=null, idToken=null, cart=[], screen="pickup", agreed=false, cname="", day=null, time=null, order=null, done=null, clockSkew=0;

/* ---------- เริ่มต้น ----------
   โหลดเร็ว: เริ่มดึงเมนูทันทีพร้อมกับเปิด LINE (ไม่ต้องรอกัน)
   แสดงหน้าเลือกเวลาได้ทันทีจากเมนูที่จำไว้ในเครื่อง แล้วค่อยอัปเดตเมื่อเมนูล่าสุดมาถึง */
const LS_KEY="jcd_menu_v1";
const DEF={ok:true,open:"07:30",close:"19:30",last:"19:15",lead:15,step:5,days:7,policy:"",online:true,drinks:[],breads:[],tops:[],_def:1};
const menuP=fetch(API+"?api=menu").then(r=>r.json()).then(m=>{if(!m||!m.ok)throw 0;return m});
menuP.catch(()=>{});
const sdkLoaded=new Promise((res,rej)=>{if(window.liff)return res();const s=document.getElementById("liffsdk");s.addEventListener("load",res);s.addEventListener("error",rej)});
let liffReady=null, fresh=false;
function bkk(){
  try{const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value;return {today:g("year")+"-"+g("month")+"-"+g("day"),now:+g("hour")*60+ +g("minute")}}
  catch(e){const d=new Date();return {today:d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()),now:d.getHours()*60+d.getMinutes()}}
}
function applyMenu(m){
  M=m;clockSkew=M.now-(new Date().getHours()*60+new Date().getMinutes());
  document.getElementById("hours").textContent=M.open+"–"+M.close;
  document.getElementById("foothours").textContent="เปิดทุกวัน "+M.open+"–"+M.close+" น. · รับออเดอร์ล่วงหน้าได้ถึง "+M.last+" น.";
}
function gate(){
  if(!["pickup","menu","cart"].includes(screen))return false;
  if(!M.online){V.innerHTML='<div class="notice"><b>ขณะนี้ร้านปิดรับออเดอร์ออนไลน์ชั่วคราว</b> แวะมาที่หน้าร้านได้เลยค่ะ</div>';bar(null);return true}
  if(M.pausedUntil&&M.pausedUntil>Date.now()){const t=new Date(M.pausedUntil);
    V.innerHTML='<div class="notice"><b>ร้านยุ่งมากช่วงนี้ เลยหยุดรับออเดอร์ชั่วคราว</b> กลับมาสั่งได้อีกครั้งราว '+two(t.getHours())+":"+two(t.getMinutes())+' น. นะคะ</div>';bar(null);return true}
  return false;
}
function startLiff(){
  liffReady=(async()=>{
    await sdkLoaded;
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});throw "login"}
    idToken=liff.getIDToken();
    fetch(API,{method:"POST",body:JSON.stringify({api:"hello",idToken})}).catch(()=>{});
    liff.getProfile().then(p=>{if(cname)return;cname=(p.displayName||"").slice(0,20);
      const i=document.getElementById("nm");if(i&&!i.value){i.value=cname;cartBar()}}).catch(()=>{});
  })();
  liffReady.catch(e=>{if(e==="login")return;
    V.innerHTML='<div class="notice"><b>เปิดหน้าสั่งไม่สำเร็จ</b> รบกวนเปิดจากเมนูในแชท LINE ของร้านนะคะ</div>';bar(null)});
}
const strip=m=>JSON.stringify(Object.assign({},m,{now:0,today:0,pausedUntil:0,_def:0}));
async function boot(){
  let cached=null;try{cached=JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){}
  const b=bkk();
  applyMenu(Object.assign({},cached||DEF,{today:b.today,now:b.now,pausedUntil:0}));
  loadPending();
  if(!gate())render();
  startLiff();
  let m;
  try{m=await menuP}catch(e){
    if(!cached&&screen==="pickup"){V.innerHTML='<div class="notice"><b>โหลดเมนูไม่สำเร็จ</b> รบกวนปิดแล้วเปิดใหม่อีกครั้งนะคะ</div>';bar(null)}
    return}
  fresh=true;
  try{localStorage.setItem(LS_KEY,JSON.stringify(Object.assign({},m,{pausedUntil:0})))}catch(e){}
  const changed=strip(m)!==strip(M)||m.today!==M.today;
  applyMenu(m);
  if(gate())return;
  if(!changed)return;
  const gone=cart.filter(l=>l.bread?!bread(l.n):!drink(l.n)||!drink(l.n).prices[l.size]);
  if(gone.length){cart=cart.filter(l=>!gone.includes(l));
    alertBox("ขออภัยค่ะ เมนูนี้หมดแล้ว ระบบนำออกจากตะกร้าให้: "+gone.map(l=>l.n).join(", "))}
  const a=document.activeElement;
  if(screen==="pickup"&&a&&a.tagName==="SELECT")return;   // ลูกค้ากำลังเลือกอยู่ หน้าจะอัปเดตเองเมื่อเลือกเสร็จ
  if(document.querySelector(".scrim")&&!gone.length)return;
  if(["pickup","menu","cart"].includes(screen))({pickup:renderPickup,menu:renderMenu,cart:renderCart})[screen]();
}
async function waitMenu(){if(fresh||!M._def)return true;try{await menuP;return fresh}catch(e){return false}}
async function post(body){

/* ---------- บันทึก QR เป็นรูป ---------- */
function qrCanvas(text,size){const d=document.createElement("div");new QRCode(d,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});return d.querySelector("canvas")}
async function qrImageURL(){
  try{await Promise.race([document.fonts.load('600 40px "Noto Sans Thai"'),new Promise(r=>setTimeout(r,800))])}catch(e){}
  const W=720,H=1010,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d"),F='"Noto Sans Thai",sans-serif';
  g.fillStyle="#fff";g.fillRect(0,0,W,H);g.fillStyle="#cf1b26";g.fillRect(0,0,W,120);
  g.textAlign="center";g.fillStyle="#fff";g.font="600 40px "+F;g.fillText("จงชงดี สาขาหนองผึ้ง สารภี",W/2,76);
  g.imageSmoothingEnabled=false;g.drawImage(qrCanvas(order.qr,560),80,165,560,560);
  g.fillStyle="#241714";g.font="700 66px "+F;g.fillText(baht(order.total)+" บาท",W/2,820);
  g.fillStyle="#6b5450";g.font="400 28px "+F;
  g.fillText("รับ "+dayLabel()+" เวลา "+time+" น.",W/2,874);
  g.fillText("ออเดอร์ "+(order.id||""),W/2,914);
  g.fillText("Thai QR · สแกนจ่ายได้ทุกธนาคาร",W/2,962);
  return c.toDataURL("image/png");
}
async function saveQR(){
  const b=document.getElementById("saveqr");if(!window.QRCode){toast("รอสักครู่นะคะ");return}
  b.disabled=true;const label=b.textContent;b.textContent="กำลังเตรียมรูป…";
  try{
    const url=await qrImageURL(),name="jongchongdee-QR-"+(order.id||"order")+".png";
    const blob=await (await fetch(url)).blob(),file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==="AbortError")return}
    }
    const inLine=window.liff&&liff.isInClient&&liff.isInClient();
    if(inLine&&/Android/i.test(navigator.userAgent)){
      // แอป LINE บน Android บันทึกรูปจากในแอปไม่ได้ เลยเปิดหน้าบันทึกรูปใน Chrome แทน
      const q=new URLSearchParams({q:order.qr,a:order.total,t:"รับ "+dayLabel()+" เวลา "+time+" น.",id:order.id||""});
      liff.openWindow({url:location.origin+location.pathname.replace(/[^/]*$/,"")+"qr.html#"+q.toString(),external:true});
      toast("เปิดหน้าบันทึกรูปใน Chrome แล้ว บันทึกเสร็จกลับมาแนบสลิปที่นี่ได้เลยค่ะ");return;
    }
    if(!inLine){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
    qrPreview(url,inLine);
  }catch(e){toast("บันทึกรูปไม่สำเร็จ รบกวนแคปหน้าจอแทนนะคะ")}
  finally{b.disabled=false;b.textContent=label}
}

const drink=n=>M.drinks.find(d=>d.n===n), bread=n=>M.breads.find(b=>b.n===n), topOf=n=>M.tops.find(t=>t.n===n);
const sizesOf=d=>["XS","S","M","L"].filter(s=>d.prices[s]).map(s=>[s,d.prices[s]]);
const cats=()=>[...new Set(M.drinks.map(d=>d.cat))];
function priceOf(l){
  if(l.bread)return bread(l.n).price*l.qty;
  return (drink(l.n).prices[l.size]+l.tops.reduce((a,t)=>a+(topOf(t)?topOf(t).price:0),0))*l.qty;
}
const total=()=>cart.reduce((a,l)=>a+priceOf(l),0);
const count=()=>cart.reduce((a,l)=>a+l.qty,0);
function describe(l){
  if(l.bread)return l.qty+" แผ่น";
  return [l.size+" · "+SIZELABEL[l.size],l.sweet?"หวาน "+l.sweet:null,l.tops.length?l.tops.join(", "):null,l.qty+" แก้ว"].filter(Boolean).join(" · ");
}
function addBread(n,q){const ex=cart.find(l=>l.bread&&l.n===n);if(ex)ex.qty+=q;else cart.push({bread:1,n,qty:q,tops:[]})}

/* ---------- วันเวลารับ ---------- */
function serverNow(){const d=new Date();return d.getHours()*60+d.getMinutes()+clockSkew}
function earliestToday(){let t=Math.ceil((serverNow()+M.lead)/M.step)*M.step;if(t<toMin(M.open))t=toMin(M.open);return t>toMin(M.last)?null:t}
function dayOptions(){
  const out=[],base=new Date(M.today+"T12:00:00");
  for(let i=0;i<M.days;i++){const d=new Date(base);d.setDate(base.getDate()+i);
    const k=d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate());
    if(i===0&&earliestToday()===null)continue;
    out.push({k,label:(i===0?"วันนี้":i===1?"พรุ่งนี้":TH_DAY[d.getDay()])+" "+d.getDate()+" "+TH_MON[d.getMonth()]})}
  return out;
}
function timeOptions(k){const start=k===M.today?earliestToday():toMin(M.open);if(start===null)return [];
  const o=[];for(let t=start;t<=toMin(M.last);t+=M.step)o.push(hhmm(t));return o}
const dayLabel=()=>(dayOptions().find(d=>d.k===day)||{}).label||day;
const topOK=t=>!t.from||toMin(time)>=toMin(t.from);
function dropUnavailable(){
  const hit=[];
  cart.forEach(l=>{if(l.bread)return;const bad=l.tops.filter(t=>!topOf(t)||!topOK(topOf(t)));
    if(bad.length){l.tops=l.tops.filter(t=>!bad.includes(t));hit.push(l.n+" ("+l.size+"): "+bad.join(", "))}});
  return hit;
}

function stepper(val,min,max,onChange,small){
  const w=document.createElement("div");w.className="step"+(small?" sm":"");
  w.innerHTML='<button type="button" aria-label="ลด">−</button><input type="number" inputmode="numeric" value="'+val+'"><button type="button" aria-label="เพิ่ม">+</button>';
  const [minus,inp,plus]=w.children;
  const sync=v=>{v=Math.min(max,Math.max(min,v||min));inp.value=v;minus.disabled=v<=min;plus.disabled=v>=max;onChange(v)};
  minus.onclick=()=>sync(+inp.value-1);plus.onclick=()=>sync(+inp.value+1);
  inp.oninput=()=>{const v=parseInt(inp.value,10);if(!isNaN(v)&&v>=min&&v<=max){plus.disabled=v>=max;minus.disabled=v<=min;onChange(v)}};
  inp.onblur=()=>sync(parseInt(inp.value,10));sync(val);return w;
}

  sc.innerHTML='<div class="sheet"><div class="sheet-top"><h3>'+(isBread?"ขนมปัง ":"")+esc(name)+'</h3><button class="x" id="cl">×</button></div>'

     +(M.tops.length?'<div class="grp"><div class="lab">ท็อปปิ้ง (เลือกได้หลายอย่าง)</div><div class="opts" id="tp">'
       +M.tops.map(t=>'<button class="opt" data-t="'+esc(t.n)+'" aria-pressed="'+sel.tops.includes(t.n)+'"'+(topOK(t)?"":" disabled")+'>'+esc(t.n)+' <small>+'+t.price+'฿</small></button>').join("")+'</div>'
       +M.tops.filter(t=>!topOK(t)).map(t=>'<div class="soon">'+esc(t.n)+'พร้อมขายตั้งแต่ '+t.from+' น. ลองเลื่อนเวลารับดูนะคะ</div>').join("")+'</div>':''))

     +M.breads.map(b=>'<button class="opt" data-b="'+esc(b.n)+'" aria-pressed="false">'+esc(b.n)+' <small>+'+b.price+'฿</small></button>').join("")+'</div><div class="soon">เลือกได้หลายหน้า ปรับจำนวนทีหลังในตะกร้าได้ค่ะ</div></div>')
   +'<button class="btn" id="add" style="margin-top:20px">'+(editing?"บันทึกการแก้ไข":"เพิ่มลงตะกร้า")+' <span class="amt" id="pv"></span></button></div>';
  document.body.appendChild(sc);
  const close=()=>sc.remove();sc.onclick=e=>{if(e.target===sc)close()};sc.querySelector("#cl").onclick=close;
  const pairSel=[];
  const upd=()=>sc.querySelector("#pv").textContent=baht(priceOf(sel)+pairSel.reduce((a,n)=>a+bread(n).price,0))+" บาท";
  const pick=(box,attr,k)=>{const el=sc.querySelector("#"+box);if(!el)return;el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    el.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");sel[k]=b.dataset[attr];upd()})};
  pick("sz","s","size");pick("sw","v","sweet");
  const tp=sc.querySelector("#tp");if(tp)tp.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.disabled)return;
    const on=b.getAttribute("aria-pressed")==="true";b.setAttribute("aria-pressed",String(!on));sel.tops=on?sel.tops.filter(t=>t!==b.dataset.t):[...sel.tops,b.dataset.t];upd()});
  const pr=sc.querySelector("#pair");if(pr)pr.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{

   +'<h2>วันและเวลาที่มารับ</h2>'+pickupSummary()
   +'<h2>ชื่อสำหรับเรียกตอนมารับ</h2><input type="text" id="nm" maxlength="20" value="'+esc(cname)+'" placeholder="เช่น มิ้นท์">'
   +'<div class="soon">ดึงมาจากชื่อ LINE ของคุณ แก้เป็นชื่อเล่นที่อยากให้พนักงานเรียกได้เลยค่ะ</div>'
   +'<label class="agree"><input type="checkbox" id="ag"'+(agreed?" checked":"")+'><span><b>'+esc(M.policy||("ทางร้านจะเก็บออเดอร์จนถึง "+M.close+" น. หากไม่มารับ ทางร้านขอสงวนสิทธิ์ไม่คืนเงินทุกกรณีค่ะ"))+'</b></span></label>';
  cart.forEach((l,i)=>V.querySelector('[data-q="'+i+'"]').appendChild(stepper(l.qty,1,99,v=>{cart[i].qty=v;refresh()},true)));
  V.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>openSheet(cart[+b.dataset.e].n,false,+b.dataset.e));
  V.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.d,1);render()});
  V.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{addBread(b.dataset.add,1);render()});
  V.querySelector("#ag").onchange=e=>{agreed=e.target.checked;cartBar()};
  V.querySelector("#nm").oninput=e=>{cname=e.target.value;cartBar()};
  wireSummary();cartBar();
}
function refresh(){V.querySelectorAll(".line").forEach((row,i)=>{row.querySelector(".pr").textContent=baht(priceOf(cart[i]));row.querySelector(".s").textContent=describe(cart[i])});
  V.querySelector(".tot b").textContent=baht(total())+" บาท";cartBar()}
function cartBar(){
  const ok=cart.length&&agreed&&cname.trim();
  bar(['<button class="btn btn-ghost" id="back">เลือกเพิ่ม</button>','<button class="btn" id="pay"'+(ok?"":" disabled")+'>ไปชำระเงิน <span class="amt">'+baht(total())+' บาท</span></button>']);
  document.getElementById("back").onclick=()=>{screen="menu";render()};
  if(ok)document.getElementById("pay").onclick=createOrder;
}
async function createOrder(){
  // ไปหน้าชำระเงินทันที แล้วค่อยใส่ QR เมื่อออเดอร์สร้างเสร็จ (QR จะขึ้นหลังระบบบันทึกออเดอร์แล้วเท่านั้น)
  const req={api:"create",day,time,name:cname.trim(),items:cart.map(l=>l.bread?{bread:1,n:l.n,qty:l.qty}:{n:l.n,size:l.size,sweet:l.sweet,tops:l.tops,qty:l.qty})};
  order={pending:true,total:total()};screen="pay";render();
  const back=msg=>{order=null;screen="cart";render();alertBox(msg)};
  try{
    const r=await post(req);
    if(screen!=="pay"||!order||!order.pending)return;
    if(!r.ok)return back(r.msg||"สร้างออเดอร์ไม่สำเร็จ");
    order=r;savePending();renderPay();
  }catch(e){if(screen==="pay"&&order&&order.pending)back("เชื่อมต่อไม่สำเร็จ รบกวนลองใหม่อีกครั้งนะคะ")}
}
function alertBox(msg){
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML='<div class="sheet"><div class="sheet-top"><h3>แจ้งเตือน</h3></div><div class="grp" style="font-size:14px;line-height:1.65">'+esc(msg)+'</div><button class="btn" id="ok" style="margin-top:18px">ตกลง</button></div>';
  document.body.appendChild(sc);sc.querySelector("#ok").onclick=()=>sc.remove();
}

function renderPay(){
  const wait=!!order.pending;
  V.innerHTML='<h2>ชำระเงิน <span>Thai QR · K SHOP</span></h2>'
   +'<div class="qr"><div id="qrbox" style="width:220px;height:220px;margin:0 auto 12px;background:#fff;padding:10px;border-radius:4px;display:flex;align-items:center;justify-content:center">'
     +(wait?'<div class="qrwait"><span class="spin"></span>กำลังสร้าง QR…</div>':'')+'</div>'
   +'<div class="big">'+baht(order.total)+' บาท</div><div class="sub">จงชงดี สาขาหนองผึ้ง สารภี · รับ '+esc(dayLabel())+' เวลา '+time+' น.</div></div>'
   +'<button class="btn btn-ghost" id="saveqr" style="width:100%;margin-top:12px"'+(wait?" disabled":"")+'>บันทึก QR ลงเครื่อง</button>'
   +'<ol class="steps"><li>กดปุ่ม <b>บันทึก QR ลงเครื่อง</b> หรือแคปหน้าจอนี้ไว้</li><li>เปิดแอปธนาคาร เลือกสแกนจากรูปในเครื่อง ยอดเงินจะขึ้นให้เอง</li>'
   +'<li>โอนเสร็จแล้ว กลับมาที่หน้านี้ แล้วแนบสลิปด้านล่าง</li><li>ระบบตรวจสลิปอัตโนมัติ รู้ผลภายในไม่กี่วินาที</li></ol>'
   +'<label class="drop" id="drop" for="slip">แตะเพื่อแนบสลิปโอนเงิน<br><span style="font-size:11.5px">รองรับสลิปจากทุกธนาคาร</span></label>'
   +'<input type="file" id="slip" accept="image/*" hidden'+(wait?" disabled":"")+'>';
  if(wait){bar(['<button class="btn btn-ghost" id="back">แก้ไขออเดอร์</button>','<button class="btn" disabled>กำลังสร้างออเดอร์…</button>']);
    document.getElementById("back").onclick=()=>{order=null;screen="cart";render()};return}
  const mkQR=()=>{const box=document.getElementById("qrbox");if(!box)return;if(!window.QRCode)return setTimeout(mkQR,150);
    new QRCode(box,{text:order.qr,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})};mkQR();
  V.querySelector("#slip").onchange=e=>{const f=e.target.files[0];if(f)checkSlip(f);e.target.value=""};
  V.querySelector("#saveqr").onclick=saveQR;
  bar(['<button class="btn btn-ghost" id="back">แก้ไขออเดอร์</button>','<button class="btn" disabled>รอแนบสลิป</button>']);
  document.getElementById("back").onclick=()=>{clearPending();screen="cart";render()};
}
function decodeSlip(file){
  return new Promise((res)=>{
    const img=new Image();img.onload=()=>{
      const tries=[[0,0,1,1,1],[0.4,0.5,0.6,0.5,2],[0,0.4,1,0.6,1.5],[0.5,0.6,0.5,0.4,2.5]];
      for(const [x,y,w,h,sc] of tries){
        const sw=img.width*w,sh=img.height*h,cw=Math.min(1600,sw*sc),ch=cw*sh/sw;
        const c=document.createElement("canvas");c.width=cw;c.height=ch;const g=c.getContext("2d");
        g.imageSmoothingEnabled=false;g.drawImage(img,img.width*x,img.height*y,sw,sh,0,0,cw,ch);
        const d=g.getImageData(0,0,cw,ch),r=jsQR(d.data,cw,ch,{inversionAttempts:"attemptBoth"});
        if(r&&r.data){res(r.data);return}
      }res(null)};
    img.onerror=()=>res(null);img.src=URL.createObjectURL(file);
  });
}
async function checkSlip(file){
  const drop=document.getElementById("drop");drop.textContent="กำลังตรวจสอบสลิป…";
  for(let i=0;i<30&&!window.jsQR;i++)await new Promise(r=>setTimeout(r,200));
  const qr=await decodeSlip(file);
  if(!qr){drop.innerHTML="แตะเพื่อแนบสลิปโอนเงิน";alertBox("อ่าน QR บนสลิปไม่ได้ รบกวนแนบรูปสลิปเต็มใบที่เห็น QR มุมล่างชัด ๆ นะคะ");return}
  try{
    const r=await post({api:"slip",id:order.id,qr});
    if(!r.ok){drop.innerHTML="แตะเพื่อแนบสลิปใหม่";alertBox(r.msg||"ตรวจสลิปไม่ผ่าน");return}
    done=r;screen="done";clearPending();render();sendCard();
  }catch(e){drop.innerHTML="แตะเพื่อแนบสลิปใหม่";alertBox("เชื่อมต่อไม่สำเร็จ รบกวนแนบสลิปใหม่อีกครั้งนะคะ")}
}
async function sendCard(){
  let sent=false;
  try{if(liff.isInClient()&&liff.isApiAvailable&&liff.isApiAvailable("sendMessages")===false)throw 0;
    await liff.sendMessages([{type:"text",text:"ยืนยันออเดอร์ "+done.no}]);sent=true}catch(e){}
  if(!sent){try{await post({api:"notify",id:order.id})}catch(e){}}
}
function renderDone(){
  const cups=cart.filter(l=>!l.bread).reduce((a,l)=>a+l.qty,0);
  V.innerHTML='<div class="done"><div class="check">✓</div><h3>รับออเดอร์ของ '+esc(cname.trim())+' แล้วค่ะ</h3>'
   +'<div style="color:var(--ink-soft);font-size:13px">ระบบตรวจยอดเรียบร้อย ทางร้านได้รับออเดอร์แล้ว</div>'
   +'<div style="margin-top:16px;font-size:12px;color:var(--ink-soft)">เลขออเดอร์ของคุณ</div><div class="qbig">'+esc(done.no)+'</div>'
   +'<div style="font-size:11.5px;color:var(--ink-soft)">เลขอ้างอิง '+esc(order.id)+'</div></div>'
   +'<h2>สรุปออเดอร์</h2>'+cart.map(l=>'<div class="line"><div class="meta"><div class="t">'+(l.bread?"ขนมปัง ":"")+esc(l.n)+'</div><div class="s">'+esc(describe(l))+'</div></div><div class="pr">'+baht(priceOf(l))+'</div></div>').join("")
   +'<div class="tot"><span>ชำระแล้ว</span><b>'+baht(order.total)+' บาท</b></div>'
   +'<div class="notice" style="margin-top:18px"><b>มารับ '+esc(dayLabel())+' เวลา '+time+' น.</b> ที่หน้าร้าน แจ้งเลข '+esc(done.no)+' กับพนักงานได้เลยค่ะ'
   +(cups?' · มีบัตรสะสมแต้มจงชงดี ยื่นตอนรับของ รับ '+cups+' ดวงนะคะ':'')+'</div>'
   +'<div class="soon" style="text-align:center;margin-top:10px">การ์ดยืนยันออเดอร์จะส่งเข้าแชท LINE ของร้านด้วยค่ะ</div>';
  bar(['<button class="btn btn-ghost" id="close">ปิดหน้านี้</button>','<button class="btn" id="again">สั่งเพิ่ม</button>']);
  document.getElementById("close").onclick=()=>{try{liff.closeWindow()}catch(e){}};
  document.getElementById("again").onclick=()=>{cart=[];agreed=false;day=null;time=null;order=null;done=null;screen="pickup";render()};
}
boot();
</script>
</body></html>
